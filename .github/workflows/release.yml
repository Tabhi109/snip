name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            artifact: snip-macos-arm64.tar.gz
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"
            run_tests: true
          - os: macos-latest
            target: macos-x86_64
            artifact: snip-macos-x86_64.tar.gz
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
            run_tests: false
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: snip-linux-x86_64.tar.gz
            cmake_flags: ""
            run_tests: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Release Tag Matches CMake Version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(grep -E '^[[:space:]]*project\(snip VERSION' CMakeLists.txt | sed -E 's/.*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Release tag version: ${TAG_VERSION}"
          echo "CMakeLists.txt version: ${CMAKE_VERSION}"
          if [ "${TAG_VERSION}" != "${CMAKE_VERSION}" ]; then
            echo "::error::Release tag version (${TAG_VERSION}) does not match CMakeLists.txt version (${CMAKE_VERSION})!"
            exit 1
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build Binary
        run: cmake --build build --config Release

      - name: Verify Binary Version
        if: ${{ matrix.run_tests }}
        run: |
          BIN_VERSION=$(./build/snip --version | awk '{print $3}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Binary version: ${BIN_VERSION}"
          if [ "${BIN_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Built binary version (${BIN_VERSION}) does not match release tag (${TAG_VERSION})!"
            exit 1
          fi

      - name: Run Tests
        if: ${{ matrix.run_tests }}
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          tar -czvf ${{ matrix.artifact }} -C build snip

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}