schema_version = "1.0"
name = "kubectl-get"
description = "Prunes kubectl resources to core status columns"
strategy = "columnar"

[match]
binary = "kubectl"
subcommands = ["get"]
exit_codes = [0]

[columnar]
header_row = 0
keep_columns = ["NAME", "READY", "STATUS", "RESTARTS", "AGE"]
drop_empty_columns = true
max_rows = 50
truncation_indicator = "[...+resources omitted...]"
